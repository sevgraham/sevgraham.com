{%- assign full_title = page.title | default: site.title -%}
{%- if page.title and page.title != site.title -%}{%- assign full_title = page.title | append: " | " | append: site.title -%}{%- endif -%}
{%- assign og_image = page.og_image | default: "/profile.jpg" -%}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ page.description }}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:title" content="{{ full_title }}" />
<meta property="og:description" content="{{ page.og_description | default: page.description }}" />
<meta property="og:image" content="{{ og_image | absolute_url }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta name="twitter:card" content="{{ page.card | default: 'summary' }}" />
<title>{{ full_title }}</title>
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}" />
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" type="text/css" />
